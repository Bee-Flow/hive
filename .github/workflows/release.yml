# Release workflow for the hive (agent-hub) frontend.
#
# Trigger: pushing a tag matching v*.*.* (e.g. v1.2.3).
#
# Jobs:
#   1. Build the SPA (Vite) on Node 20.
#   2. Attach dist.tar.gz + sha256sum to a GitHub Release. The connector
#      docker image builds hive from source at HIVE_REF=main, so no npm
#      distribution is needed — consumers either pull main or download
#      the GitHub Release artefact.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create GitHub Releases

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The artefact must NOT bake in a private API URL — leave it
          # relative so the host (server / connector) controls the target.
          VITE_API_URL: ''

      - name: Smoke-check dist
        run: |
          test -f dist/index.html
          test -d dist/assets
          ls -la dist | head -20

      - name: Package dist tarball for GitHub Release
        run: |
          tar -czf dist.tar.gz dist/
          sha256sum dist.tar.gz > dist.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist.tar.gz
            dist.tar.gz.sha256
