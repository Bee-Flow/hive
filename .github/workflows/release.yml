# Release workflow for @beeflow/frontend
#
# Trigger: pushing a tag matching v*.*.* (e.g. v1.2.3).
#
# Jobs:
#   1. Build the SPA (Vite) on Node 20.
#   2. Publish the built dist/ as @beeflow/frontend on npm with provenance.
#   3. Attach dist.tar.gz + sha256sum to a GitHub Release for App Store reviewers.
#
# Required repo secrets:
#   NPM_TOKEN  — automation token from npmjs.com with publish access to @beeflow.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create GitHub Releases
  id-token: write   # npm provenance (sigstore)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The published artefact must NOT bake in a private API URL — leave
          # it relative so the host (server / connector) controls the target.
          VITE_API_URL: ''

      - name: Smoke-check dist
        run: |
          test -f dist/index.html
          test -d dist/assets
          ls -la dist | head -20

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package dist tarball for GitHub Release
        run: |
          tar -czf dist.tar.gz dist/
          sha256sum dist.tar.gz > dist.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist.tar.gz
            dist.tar.gz.sha256
